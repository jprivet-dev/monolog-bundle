monolog:
    handlers:
        custom:
            type_stream:
                path: /tmp/symfony.log
                bubble: false
                level: ERROR
                file_permission: 438 # decimal representation of 0666 octal
        main:
            type_fingers_crossed:
                action_level: ERROR
                passthru_level: NOTICE
                handler: nested
        nested:
            type_stream: ~
        filtered:
            type_filter:
                accepted_levels: [WARNING, ERROR]
                handler: nested2
        nested2:
            type_stream: ~
