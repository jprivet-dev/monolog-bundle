imports:
    - { resource: new_and_priority_import.yml }

monolog:
    handlers:
        custom:
            type_stream:
                path: /tmp/symfony.log
                bubble: true
                level: WARNING
        first:
            type_rotating_file:
                path: /tmp/monolog.log
                bubble: true
                level: ERROR
                priority: 3
        last:
            type_stream:
                path: /tmp/last.log
                bubble: true
                level: ERROR
                priority: -3
